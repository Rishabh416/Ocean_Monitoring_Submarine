<!DOCTYPE html>
<html>
<head>
    <title>Submarine Control Panel</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
        }

        .vertical-slider-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 400px;
            justify-content: center;
        }

        .side-slider {
            transform: rotate(270deg);
            transform-origin: center;
            width: 300px; /* Actual visual length of slider */
        }

        .video-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .bottom-controls {
            margin-top: 20px;
        }

        .z-slider {
            width: 400px;
        }

        button {
            margin: 0 10px;
            padding: 8px 16px;
            font-size: 16px;
        }

        .value-label {
            margin-top: 8px;
            font-weight: bold;
        }
    </style>

    <script>
        function updateSliderValue(slider, labelId) {
            document.getElementById(labelId).textContent = slider.value;
            slider.form.submit();
        }

        function toggleRecording(btn) {
            fetch('/record', { method: 'POST' }).then(() => {
                btn.textContent = btn.textContent === "Start Recording" ? "Stop Recording" : "Start Recording";
            });
        }
    </script>
</head>
<body>
    <h1>Submarine Control Panel</h1>

    <div class="container">
        <!-- X Axis Slider -->
        <div class="vertical-slider-wrapper">
            <form method="POST" action="/control">
                <input type="range" min="1000" max="2000" value="1500"
                       class="side-slider" name="value"
                       oninput="updateSliderValue(this, 'xVal')">
                <input type="hidden" name="axis" value="m1">
                <div class="value-label">X: <span id="xVal">1500</span></div>
            </form>
        </div>

        <!-- Center Video Panel -->
        <div class="video-panel">
            <img src="{{ url_for('video_feed') }}" width="640" height="480" style="border: 1px solid #ccc"/>

            <div class="bottom-controls">
                <!-- Z Axis Slider -->
                <form method="POST" action="/control" style="margin-bottom: 10px;">
                    <input type="range" min="1000" max="2000" value="1500"
                           class="z-slider" name="value"
                           oninput="updateSliderValue(this, 'zVal')">
                    <input type="hidden" name="axis" value="m3">
                    <div class="value-label">Z: <span id="zVal">1500</span></div>
                </form>

                <!-- Buttons -->
                <form method="POST" action="/photo" style="display: inline;">
                    <button type="submit">Take Photo</button>
                </form>

                <button type="button" onclick="toggleRecording(this)">Start Recording</button>
            </div>
        </div>

        <!-- Y Axis Slider -->
        <div class="vertical-slider-wrapper">
            <form method="POST" action="/control">
                <input type="range" min="1000" max="2000" value="1500"
                       class="side-slider" name="value"
                       oninput="updateSliderValue(this, 'yVal')">
                <input type="hidden" name="axis" value="m2">
                <div class="value-label">Y: <span id="yVal">1500</span></div>
            </form>
        </div>
    </div>
</body>
</html>
